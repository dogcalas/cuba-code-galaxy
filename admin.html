<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Cuba Code Galaxy</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#020408;--surface:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.10);--text:#e8eaf0;--muted:#7a8090;--accent:#56d4f7;--accent2:#f7a556;--green:#69f0ae;--red:#f76464;--font-d:'Orbitron',monospace;--font-b:'Inter',system-ui,sans-serif}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-b);padding:20px}
.wrap{max-width:700px;margin:0 auto}
h1{font-family:var(--font-d);font-size:18px;margin-bottom:4px}
h1 span{color:var(--accent)}
.sub{font-size:11px;color:var(--muted);margin-bottom:20px}

/* login */
#login-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;max-width:360px;margin:80px auto}
#login-box h2{font-family:var(--font-d);font-size:14px;margin-bottom:14px;color:var(--accent)}
#login-box input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:var(--font-b);font-size:13px;outline:none;margin-bottom:12px}
#login-box input:focus{border-color:var(--accent)}
#login-box button{width:100%;padding:10px;background:rgba(86,212,247,.12);border:1px solid rgba(86,212,247,.3);border-radius:8px;color:var(--accent);font-family:var(--font-d);font-size:11px;font-weight:700;cursor:pointer}
#login-box button:hover{background:rgba(86,212,247,.22)}
.login-err{color:var(--red);font-size:11px;margin-top:8px;display:none}

/* dashboard */
#dashboard{display:none}
.stats-row{display:flex;gap:12px;margin-bottom:20px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 8px;text-align:center}
.stat-card .v{font-family:var(--font-d);font-size:18px;font-weight:700;color:var(--accent)}
.stat-card .k{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.repo-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px}
.repo-row:hover{background:rgba(255,255,255,.03)}
.repo-name{flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo-name a{color:var(--accent);text-decoration:none}
.repo-name a:hover{text-decoration:underline}
.repo-desc{font-size:10px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo-lang{font-size:9px;padding:2px 6px;border-radius:3px;background:rgba(86,212,247,.12);color:var(--accent);border:1px solid rgba(86,212,247,.2);font-weight:600;flex-shrink:0}
.repo-stats{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0;min-width:60px;text-align:right}
.btn-del{background:rgba(247,100,100,.1);border:1px solid rgba(247,100,100,.3);color:var(--red);font-size:9px;padding:3px 8px;border-radius:4px;cursor:pointer;flex-shrink:0}
.btn-del:hover{background:rgba(247,100,100,.2)}
.page-btn{background:rgba(86,212,247,.1);border:1px solid rgba(86,212,247,.25);color:var(--accent);padding:5px 10px;border-radius:5px;cursor:pointer;font-size:11px}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-btn:not(:disabled):hover{background:rgba(86,212,247,.2)}

.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tab{padding:8px 16px;font-size:11px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}

/* submission cards */
.sub-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.sub-url{font-family:var(--font-d);font-size:11px;color:var(--accent);word-break:break-all;margin-bottom:4px}
.sub-meta{font-size:10px;color:var(--muted);margin-bottom:4px}
.sub-reason{font-size:11px;color:var(--text);margin-bottom:10px;line-height:1.4}
.sub-actions{display:flex;gap:8px}
.btn-approve,.btn-reject{padding:6px 14px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid;transition:opacity .15s}
.btn-approve{background:rgba(105,240,174,.1);border-color:rgba(105,240,174,.3);color:var(--green)}
.btn-approve:hover{opacity:.8}
.btn-reject{background:rgba(247,100,100,.1);border-color:rgba(247,100,100,.3);color:var(--red)}
.btn-reject:hover{opacity:.8}
.sub-status{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;display:inline-block}
.sub-status.approved{background:rgba(105,240,174,.12);color:var(--green)}
.sub-status.rejected{background:rgba(247,100,100,.12);color:var(--red)}
.sub-status.pending{background:rgba(86,212,247,.12);color:var(--accent)}

.empty{text-align:center;color:var(--muted);font-size:12px;padding:30px 0}
.back{display:inline-block;margin-top:18px;font-size:11px;color:var(--accent);text-decoration:none}
.back:hover{text-decoration:underline}
</style>
</head>
<body>

<!-- Login -->
<div id="login-box">
  <h2>Admin Login</h2>
  <input type="password" id="key-input" placeholder="Admin key" autofocus/>
  <button id="login-btn">Entrar</button>
  <div class="login-err" id="login-err">Key incorrecta</div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="wrap">
  <h1><span>Cuba</span> Code Galaxy — Admin</h1>
  <div class="sub">Gestiona submissions y datos del ecosistema</div>

  <div class="stats-grid">
    <div class="stat-card"><div class="v" id="s-repos">-</div><div class="k">Repos</div></div>
    <div class="stat-card"><div class="v" id="s-devs">-</div><div class="k">Devs</div></div>
    <div class="stat-card"><div class="v" id="s-owners">-</div><div class="k">Owners únicos</div></div>
    <div class="stat-card"><div class="v" id="s-langs">-</div><div class="k">Lenguajes</div></div>
    <div class="stat-card"><div class="v" id="s-stars">-</div><div class="k">★ Stars</div></div>
    <div class="stat-card"><div class="v" id="s-forks">-</div><div class="k">⑂ Forks</div></div>
    <div class="stat-card"><div class="v" id="s-pending">-</div><div class="k">Pendientes</div></div>
    <div class="stat-card"><div class="v" id="s-subs">-</div><div class="k">Total subs</div></div>
  </div>

  <div style="margin-bottom:14px">
    <button id="scan-btn" style="padding:8px 16px;background:rgba(86,212,247,.12);border:1px solid rgba(86,212,247,.3);border-radius:8px;color:var(--accent);font-family:var(--font-d);font-size:11px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:background .15s">⟳ Escanear GitHub</button>
    <span id="scan-msg" style="margin-left:10px;font-size:11px;color:var(--muted)"></span>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="repos">Repos</div>
    <div class="tab" data-tab="pending">Pendientes</div>
    <div class="tab" data-tab="history">Historial</div>
  </div>

  <div class="tab-content active" id="tab-repos">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="repo-search" type="text" placeholder="Buscar repo, descripción, lenguaje…" style="flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-family:var(--font-b);font-size:12px;outline:none"/>
      <button id="search-btn" style="padding:8px 14px;background:rgba(86,212,247,.12);border:1px solid rgba(86,212,247,.3);border-radius:6px;color:var(--accent);font-size:11px;font-weight:600;cursor:pointer">Buscar</button>
    </div>
    <div id="repos-list"></div>
    <div id="repos-pagination" style="display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;font-size:11px;color:var(--muted)"></div>
  </div>
  <div class="tab-content" id="tab-pending">
    <div id="pending-list"></div>
  </div>
  <div class="tab-content" id="tab-history">
    <div id="history-list"></div>
  </div>

  <a class="back" href="/">← Volver a la Galaxia</a>
</div>

<script>
const API = 'https://cuba-code-galaxy-api.dogcalas.workers.dev';
let adminKey = '';

// ── Login ──
document.getElementById('login-btn').addEventListener('click', tryLogin);
document.getElementById('key-input').addEventListener('keydown', e => { if(e.key==='Enter') tryLogin(); });

async function tryLogin() {
  adminKey = document.getElementById('key-input').value.trim();
  if (!adminKey) return;
  // Test key by fetching submissions
  try {
    const res = await fetch(API + '/api/submissions');
    const data = await res.json();
    if (Array.isArray(data)) {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadDashboard();
    } else {
      showLoginErr();
    }
  } catch (e) { showLoginErr(); }
}
function showLoginErr() {
  const el = document.getElementById('login-err');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2000);
}

// ── Scan button ──
document.getElementById('scan-btn').addEventListener('click', async () => {
  const btn = document.getElementById('scan-btn');
  const msg = document.getElementById('scan-msg');
  btn.disabled = true; btn.style.opacity = '.6';
  btn.textContent = '⟳ Iniciando…';
  msg.textContent = '';
  try {
    const before = await fetch(API + '/api/scan/status').then(r => r.json()).catch(() => ({ repos: 0 }));
    await fetch(API + '/api/scan', { method: 'POST' });
    btn.textContent = '⟳ Escaneando…';
    msg.textContent = `Procesando en background (puede tardar 30s)`;
    let attempts = 0;
    const poll = setInterval(async () => {
      attempts++;
      const after = await fetch(API + '/api/scan/status').then(r => r.json()).catch(() => null);
      if (after && after.repos !== before.repos) {
        const diff = after.repos - before.repos;
        btn.textContent = '⟳ Escanear GitHub';
        msg.textContent = `✓ +${diff} repos · total ${after.repos}`;
        clearInterval(poll);
        btn.disabled = false; btn.style.opacity = '1';
        loadDashboard();
      } else if (attempts >= 12) {
        btn.textContent = '⟳ Escanear GitHub';
        msg.textContent = `✓ Sin cambios · ${after?.repos || '?'} repos`;
        clearInterval(poll);
        btn.disabled = false; btn.style.opacity = '1';
      }
    }, 4000);
  } catch (e) {
    msg.textContent = 'Error: ' + e.message;
    btn.textContent = '⟳ Escanear GitHub';
    btn.disabled = false; btn.style.opacity = '1';
  }
});

// ── Tabs ──
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-' + t.dataset.tab).classList.add('active');
  });
});

// ── Load data ──
function fmtNum(n){return n>=1000?(n/1000).toFixed(1)+'k':String(n||0)}

async function loadDashboard() {
  const [stats, subsRes] = await Promise.all([
    fetch(API + '/api/admin/stats').then(r => r.json()),
    fetch(API + '/api/submissions').then(r => r.json()),
  ]);

  document.getElementById('s-repos').textContent = stats.repos;
  document.getElementById('s-devs').textContent = stats.devs;
  document.getElementById('s-owners').textContent = stats.unique_owners;
  document.getElementById('s-langs').textContent = stats.langs;
  document.getElementById('s-stars').textContent = fmtNum(stats.stars);
  document.getElementById('s-forks').textContent = fmtNum(stats.forks);
  document.getElementById('s-pending').textContent = stats.pending_submissions;
  document.getElementById('s-subs').textContent = stats.total_submissions;

  // Load first page of repos
  loadRepos(1, '');

  const pending = subsRes.filter(s => s.status === 'pending');

  // Pending
  const pList = document.getElementById('pending-list');
  if (!pending.length) {
    pList.innerHTML = '<div class="empty">No hay submissions pendientes</div>';
  } else {
    pList.innerHTML = pending.map(s => `
      <div class="sub-card" id="sub-${s.id}">
        <div class="sub-url">${esc(s.repo_url)}</div>
        <div class="sub-meta">Por: ${esc(s.submitter_name || 'Anon')} · ${s.created_at}</div>
        ${s.reason ? '<div class="sub-reason">' + esc(s.reason) + '</div>' : ''}
        <div class="sub-actions">
          <button class="btn-approve" onclick="approve(${s.id})">Aprobar</button>
          <button class="btn-reject" onclick="reject(${s.id})">Rechazar</button>
        </div>
      </div>
    `).join('');
  }

  // History
  const history = subsRes.filter(s => s.status !== 'pending');
  const hList = document.getElementById('history-list');
  if (!history.length) {
    hList.innerHTML = '<div class="empty">Sin historial</div>';
  } else {
    hList.innerHTML = history.map(s => `
      <div class="sub-card">
        <div class="sub-url">${esc(s.repo_url)}</div>
        <div class="sub-meta">Por: ${esc(s.submitter_name || 'Anon')} · ${s.created_at}</div>
        <span class="sub-status ${s.status}">${s.status}</span>
      </div>
    `).join('');
  }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── Repos browser with pagination + search ──
let currentPage = 1, currentQuery = '', totalPages = 1;
async function loadRepos(page, q) {
  currentPage = page; currentQuery = q;
  const url = API + '/api/admin/repos?page=' + page + '&per_page=25' + (q ? '&q=' + encodeURIComponent(q) : '');
  const data = await fetch(url).then(r => r.json());
  totalPages = data.total_pages;
  const list = document.getElementById('repos-list');
  if (!data.repos.length) {
    list.innerHTML = '<div class="empty">Sin resultados</div>';
  } else {
    list.innerHTML = data.repos.map(r => `
      <div class="repo-row" id="repo-${r.id}">
        <div style="flex:1;min-width:0">
          <div class="repo-name"><a href="https://github.com/${esc(r.repo)}" target="_blank">${esc(r.repo)}</a></div>
          ${r.description ? '<div class="repo-desc">' + esc(r.description) + '</div>' : ''}
        </div>
        <span class="repo-lang">${esc(r.lang)}</span>
        <span class="repo-stats">★ ${r.stars} · ⑂ ${r.forks}</span>
        <button class="btn-del" onclick="deleteRepo(${r.id}, '${esc(r.repo)}')">×</button>
      </div>
    `).join('');
  }
  // Pagination
  const pag = document.getElementById('repos-pagination');
  pag.innerHTML = `
    <button class="page-btn" id="prev-btn" ${page <= 1 ? 'disabled' : ''}>‹ Anterior</button>
    <span>Página ${page} de ${totalPages || 1} · ${data.total} repos</span>
    <button class="page-btn" id="next-btn" ${page >= totalPages ? 'disabled' : ''}>Siguiente ›</button>
  `;
  document.getElementById('prev-btn').onclick = () => loadRepos(page - 1, currentQuery);
  document.getElementById('next-btn').onclick = () => loadRepos(page + 1, currentQuery);
}

document.getElementById('search-btn').addEventListener('click', () => {
  loadRepos(1, document.getElementById('repo-search').value.trim());
});
document.getElementById('repo-search').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loadRepos(1, e.target.value.trim());
});

async function deleteRepo(id, repoName) {
  if (!confirm('Eliminar ' + repoName + '?')) return;
  const res = await fetch(API + '/api/admin/repo', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, admin_key: adminKey }),
  });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('repo-' + id).remove();
    const c = parseInt(document.getElementById('s-repos').textContent) - 1;
    document.getElementById('s-repos').textContent = c;
  } else {
    alert('Error: ' + (data.error || 'unknown'));
  }
}

async function approve(id) {
  const card = document.getElementById('sub-' + id);
  card.style.opacity = '.5';
  const res = await fetch(API + '/api/approve', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, admin_key: adminKey }),
  });
  const data = await res.json();
  if (data.ok) {
    card.innerHTML = '<div class="sub-meta">Aprobado: ' + (data.repo || '') + '</div><span class="sub-status approved">approved</span>';
    card.style.opacity = '1';
    const n = parseInt(document.getElementById('s-pending').textContent) - 1;
    document.getElementById('s-pending').textContent = Math.max(0, n);
    const t = parseInt(document.getElementById('s-repos').textContent) + 1;
    document.getElementById('s-repos').textContent = t;
  } else {
    alert('Error: ' + (data.error || 'unknown'));
    card.style.opacity = '1';
  }
}

async function reject(id) {
  const card = document.getElementById('sub-' + id);
  card.style.opacity = '.5';
  const res = await fetch(API + '/api/reject', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, admin_key: adminKey }),
  });
  const data = await res.json();
  if (data.ok) {
    card.innerHTML = '<div class="sub-meta">Rechazado</div><span class="sub-status rejected">rejected</span>';
    card.style.opacity = '1';
    const n = parseInt(document.getElementById('s-pending').textContent) - 1;
    document.getElementById('s-pending').textContent = Math.max(0, n);
  } else {
    alert('Error: ' + (data.error || 'unknown'));
    card.style.opacity = '1';
  }
}
</script>
</body>
</html>
