<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Enviar Repo — Cuba Code Galaxy</title>
<meta name="description" content="Agrega un repositorio cubano al ecosistema de Cuba Code Galaxy. Comparte proyectos open-source hechos en Cuba."/>
<meta name="robots" content="index, follow"/>
<meta name="theme-color" content="#020408"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="canonical" href="https://cuba-code-galaxy.pages.dev/submit.html"/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://cuba-code-galaxy.pages.dev/submit.html"/>
<meta property="og:title" content="Enviar Repo — Cuba Code Galaxy"/>
<meta property="og:description" content="Agrega un repositorio cubano al ecosistema de Cuba Code Galaxy."/>
<meta property="og:image" content="https://cuba-code-galaxy.pages.dev/preview.jpg"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="Enviar Repo — Cuba Code Galaxy"/>
<meta name="twitter:image" content="https://cuba-code-galaxy.pages.dev/preview.jpg"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#020408;--surface:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.10);--text:#e8eaf0;--muted:#7a8090;--accent:#56d4f7;--accent2:#f7a556;--font-d:'Orbitron',monospace;--font-b:'Inter',system-ui,sans-serif}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-b);display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:100%;max-width:460px;backdrop-filter:blur(14px)}
.logo-row{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo-row svg{width:32px;height:32px;flex-shrink:0}
.logo-row h1{font-family:var(--font-d);font-size:16px;font-weight:700;letter-spacing:.08em}
.logo-row h1 span{color:var(--accent)}
.subtitle{font-size:12px;color:var(--muted);margin-bottom:24px;line-height:1.5}
label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;margin-top:16px}
input,textarea{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:var(--font-b);font-size:13px;outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
.req{color:var(--accent)}
.turnstile-wrap{margin-top:20px;display:flex;justify-content:center}
button[type=submit]{margin-top:20px;width:100%;padding:12px;background:rgba(86,212,247,.12);border:1px solid rgba(86,212,247,.3);border-radius:8px;color:var(--accent);font-family:var(--font-d);font-size:12px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:background .2s,border-color .2s}
button[type=submit]:hover{background:rgba(86,212,247,.22);border-color:rgba(86,212,247,.5)}
button[type=submit]:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:14px;padding:10px;border-radius:8px;font-size:12px;text-align:center;display:none}
.msg.ok{display:block;background:rgba(105,240,174,.1);border:1px solid rgba(105,240,174,.3);color:#69f0ae}
.msg.err{display:block;background:rgba(247,100,100,.1);border:1px solid rgba(247,100,100,.3);color:#f76464}
.back{display:inline-block;margin-top:18px;font-size:11px;color:var(--accent);text-decoration:none;letter-spacing:.04em}
.back:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <svg viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="16" stroke="#56d4f7" stroke-width="1.5"/><circle cx="17" cy="17" r="6" fill="#56d4f7" opacity=".9"/><circle cx="17" cy="5" r="2.5" fill="#f7a556"/><circle cx="29" cy="17" r="2" fill="#56d4f7" opacity=".5"/></svg>
    <h1><span>Cuba</span> Code Galaxy</h1>
  </div>
  <div class="subtitle">Agrega un repositorio cubano al ecosistema. Será revisado antes de aparecer en la galaxia.</div>

  <form id="form">
    <label>URL del repositorio <span class="req">*</span></label>
    <input type="url" name="repo_url" placeholder="https://github.com/usuario/repo" required/>

    <label>Tu nombre</label>
    <input type="text" name="submitter_name" placeholder="Opcional"/>

    <label>¿Por qué es relevante?</label>
    <textarea name="reason" placeholder="Explica brevemente por qué este repo debería estar en la galaxia…"></textarea>

    <div class="turnstile-wrap">
      <!-- Turnstile visible widget — replace sitekey with your real one from Cloudflare Dashboard > Turnstile -->
      <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-theme="dark" data-size="normal"></div>
    </div>

    <button type="submit" id="sbtn">Enviar Repositorio</button>
    <div class="msg" id="msg"></div>
  </form>

  <a class="back" href="/">← Volver a la Galaxia</a>
</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
const API_BASE = '/api';
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const sbtn = document.getElementById('sbtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  sbtn.disabled = true;
  sbtn.textContent = 'Enviando…';
  msg.className = 'msg'; msg.style.display = 'none';

  const fd = new FormData(form);
  const turnstileInput = document.querySelector('[name="cf-turnstile-response"]');
  const turnstile_token = turnstileInput ? turnstileInput.value : '';

  if (!turnstile_token) {
    msg.textContent = 'Completa la verificación Turnstile.';
    msg.className = 'msg err'; msg.style.display = 'block';
    sbtn.disabled = false; sbtn.textContent = 'Enviar Repositorio';
    return;
  }

  try {
    const res = await fetch(API_BASE + '/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        repo_url: fd.get('repo_url'),
        submitter_name: fd.get('submitter_name'),
        reason: fd.get('reason'),
        turnstile_token,
      }),
    });
    const data = await res.json();
    if (data.ok) {
      msg.textContent = '¡Enviado! Tu repo será revisado pronto.';
      msg.className = 'msg ok'; msg.style.display = 'block';
      form.reset();
      if (window.turnstile) turnstile.reset();
    } else {
      msg.textContent = data.error || 'Error al enviar.';
      msg.className = 'msg err'; msg.style.display = 'block';
    }
  } catch (err) {
    msg.textContent = 'Error de red. Intenta de nuevo.';
    msg.className = 'msg err'; msg.style.display = 'block';
  }

  sbtn.disabled = false; sbtn.textContent = 'Enviar Repositorio';
});
</script>
</body>
</html>
